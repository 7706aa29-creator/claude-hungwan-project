<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>할 일 관리</title>
  <style>
    :root {
      --bg: #f6f6f3;
      --card: #ffffff;
      --text: #1f2328;
      --muted: #6b7280;
      --line: #e5e7eb;
      --accent: #2f6fed;
      --accent-text: #ffffff;
      --danger: #d64545;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #16181d;
        --card: #1f2229;
        --text: #e8eaed;
        --muted: #9aa0a6;
        --line: #2f333b;
        --accent: #5b8cff;
        --accent-text: #0b1020;
        --danger: #ff6b6b;
      }
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
      line-height: 1.5;
    }
    main {
      max-width: 560px;
      margin: 48px auto;
      padding: 0 16px;
    }
    h1 { font-size: 28px; margin: 0 0 4px; }
    .summary { color: var(--muted); margin: 0 0 24px; }

    form { display: flex; gap: 8px; margin-bottom: 16px; }
    input[type="text"] {
      flex: 1;
      min-width: 0;
      padding: 12px 14px;
      font-size: 16px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--card);
      color: var(--text);
    }
    input[type="text"]:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
    button.add {
      padding: 0 18px;
      font-size: 16px;
      font-weight: 600;
      border: 0;
      border-radius: 10px;
      background: var(--accent);
      color: var(--accent-text);
      cursor: pointer;
    }

    ul { list-style: none; margin: 0; padding: 0; }
    li {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      margin-bottom: 8px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
    }
    li input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--accent); cursor: pointer; }
    li .text { flex: 1; word-break: break-word; }
    li.done .text { color: var(--muted); text-decoration: line-through; }
    li button.delete {
      border: 0;
      background: none;
      color: var(--muted);
      font-size: 14px;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
    }
    li button.delete:hover { color: var(--danger); background: var(--bg); }

    .empty { text-align: center; color: var(--muted); padding: 32px 0; }
  </style>
</head>
<body>
  <main>
    <h1>할 일 관리</h1>
    <p class="summary" id="summary"></p>

    <form id="form">
      <input type="text" id="input" placeholder="할 일을 입력하세요" autocomplete="off" aria-label="새 할 일">
      <button type="submit" class="add">추가</button>
    </form>

    <ul id="list"></ul>
    <p class="empty" id="empty">아직 할 일이 없습니다. 위에 입력해서 추가해 보세요.</p>
  </main>

  <script>
    const STORAGE_KEY = "todos";
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const list = document.getElementById("list");
    const empty = document.getElementById("empty");
    const summary = document.getElementById("summary");

    let todos = load();

    function load() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      } catch {
        return [];
      }
    }

    function save() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
      } catch {
        // 저장할 수 없는 환경(사생활 보호 모드 등)에서는 그냥 넘어갑니다.
      }
    }

    function render() {
      list.innerHTML = "";
      for (const todo of todos) {
        const li = document.createElement("li");
        if (todo.done) li.classList.add("done");

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = todo.done;
        checkbox.setAttribute("aria-label", "완료 표시");
        checkbox.addEventListener("change", () => {
          todo.done = checkbox.checked;
          save();
          render();
        });

        const text = document.createElement("span");
        text.className = "text";
        text.textContent = todo.text;

        const del = document.createElement("button");
        del.className = "delete";
        del.textContent = "삭제";
        del.addEventListener("click", () => {
          todos = todos.filter((t) => t.id !== todo.id);
          save();
          render();
        });

        li.append(checkbox, text, del);
        list.append(li);
      }

      const doneCount = todos.filter((t) => t.done).length;
      summary.textContent = todos.length
        ? `전체 ${todos.length}개 · 완료 ${doneCount}개 · 남은 일 ${todos.length - doneCount}개`
        : "오늘 할 일을 정리해 보세요.";
      empty.hidden = todos.length > 0;
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      todos.push({ id: Date.now(), text, done: false });
      input.value = "";
      save();
      render();
    });

    render();
  </script>
</body>
</html>
