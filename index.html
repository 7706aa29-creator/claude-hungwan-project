<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>할 일 관리</title>
  <style>
    :root {
      --bg: #f6f6f3;
      --card: #ffffff;
      --text: #1f2328;
      --muted: #6b7280;
      --line: #e5e7eb;
      --accent: #2f6fed;
      --accent-text: #ffffff;
      --accent-soft: #e8efff;
      --danger: #d64545;
      --danger-soft: #fdecec;
      --ok: #1f8a4c;
      --cat-work: #2f6fed;      --cat-work-soft: #e8efff;
      --cat-personal: #1f8a4c;  --cat-personal-soft: #e3f4ea;
      --cat-study: #7a4fd6;     --cat-study-soft: #efe8fc;
      --cat-shopping: #c4650f;  --cat-shopping-soft: #fdeedd;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #16181d;
        --card: #1f2229;
        --text: #e8eaed;
        --muted: #9aa0a6;
        --line: #2f333b;
        --accent: #5b8cff;
        --accent-text: #0b1020;
        --accent-soft: #23304d;
        --danger: #ff6b6b;
        --danger-soft: #3a2326;
        --ok: #6fd39a;
        --cat-work: #8fb0ff;      --cat-work-soft: #23304d;
        --cat-personal: #6fd39a;  --cat-personal-soft: #1d3527;
        --cat-study: #b99bff;     --cat-study-soft: #2e2547;
        --cat-shopping: #f2a65a;  --cat-shopping-soft: #3d2c1b;
      }
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
      line-height: 1.5;
    }
    main {
      max-width: 600px;
      margin: 48px auto;
      padding: 0 16px;
    }
    header.top {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px 12px;
      margin-bottom: 4px;
    }
    h1 { font-size: 28px; margin: 0; }
    .summary { color: var(--muted); margin: 0 0 24px; }
    .summary .cloud { color: var(--ok); font-weight: 600; }

    .account { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); }
    .account img { width: 28px; height: 28px; border-radius: 50%; }
    .account .name { color: var(--text); font-weight: 600; max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .account button {
      padding: 7px 14px;
      font-size: 14px;
      font-family: inherit;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--card);
      color: var(--text);
      cursor: pointer;
    }
    .account button:hover { border-color: var(--accent); color: var(--accent); }

    .notice {
      margin: 0 0 16px;
      padding: 10px 14px;
      font-size: 14px;
      border-radius: 10px;
      color: var(--danger);
      background: var(--danger-soft);
    }

    input[type="text"], input[type="date"] {
      padding: 12px 14px;
      font-size: 16px;
      font-family: inherit;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--card);
      color: var(--text);
      color-scheme: light dark;
    }
    select {
      padding: 12px 10px;
      font-size: 16px;
      font-family: inherit;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--card);
      color: var(--text);
      color-scheme: light dark;
      cursor: pointer;
    }
    input[type="text"]:focus, input[type="date"]:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }

    form { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
    form input[type="text"] { flex: 1 1 100%; min-width: 0; }
    form input[type="date"], form select { flex: 1 1 140px; min-width: 0; }
    form button.add { flex: 0 0 auto; }

    .view-options { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .view-options label { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--muted); }
    .view-options select { padding: 6px 8px; font-size: 14px; border-radius: 8px; }

    .tag {
      display: inline-block;
      padding: 1px 8px;
      margin-right: 6px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 999px;
      vertical-align: 1px;
    }
    .tag.work { color: var(--cat-work); background: var(--cat-work-soft); }
    .tag.personal { color: var(--cat-personal); background: var(--cat-personal-soft); }
    .tag.study { color: var(--cat-study); background: var(--cat-study-soft); }
    .tag.shopping { color: var(--cat-shopping); background: var(--cat-shopping-soft); }
    li[class*="cat-"] { border-left-width: 4px; }
    li.cat-work { border-left-color: var(--cat-work); }
    li.cat-personal { border-left-color: var(--cat-personal); }
    li.cat-study { border-left-color: var(--cat-study); }
    li.cat-shopping { border-left-color: var(--cat-shopping); }
    li.done .tag { opacity: 0.6; }
    button.add {
      padding: 12px 18px;
      font-size: 16px;
      font-weight: 600;
      border: 0;
      border-radius: 10px;
      background: var(--accent);
      color: var(--accent-text);
      cursor: pointer;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
    }
    .filters { display: flex; gap: 4px; }
    .filters button {
      padding: 6px 12px;
      font-size: 14px;
      font-family: inherit;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--card);
      color: var(--muted);
      cursor: pointer;
    }
    .filters button[aria-pressed="true"] {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent);
      font-weight: 600;
    }
    button.clear {
      padding: 6px 10px;
      font-size: 14px;
      font-family: inherit;
      border: 0;
      background: none;
      color: var(--muted);
      cursor: pointer;
      border-radius: 6px;
    }
    button.clear:hover:not(:disabled) { color: var(--danger); background: var(--danger-soft); }
    button.clear:disabled { opacity: 0.4; cursor: default; }

    ul { list-style: none; margin: 0; padding: 0; }
    li {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      margin-bottom: 8px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
    }
    li input[type="checkbox"] { flex: none; width: 20px; height: 20px; accent-color: var(--accent); cursor: pointer; }
    li .body { flex: 1; min-width: 0; }
    li .text { word-break: break-word; }
    li.done .text { color: var(--muted); text-decoration: line-through; }
    li .due { display: inline-block; margin-top: 2px; font-size: 13px; color: var(--muted); }
    li .due.today { color: var(--accent); font-weight: 600; }
    li .due.overdue { color: var(--danger); font-weight: 600; }
    li.done .due { color: var(--muted); font-weight: normal; }

    li .edit-fields { display: flex; flex-wrap: wrap; gap: 6px; }
    li .edit-fields input[type="text"] { flex: 1 1 180px; min-width: 0; padding: 6px 10px; font-size: 15px; }
    li .edit-fields input[type="date"], li .edit-fields select { padding: 6px 10px; font-size: 15px; }

    li .actions { display: flex; gap: 2px; flex: none; }
    li .actions button {
      border: 0;
      background: none;
      color: var(--muted);
      font-size: 14px;
      font-family: inherit;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
    }
    li .actions button:hover { color: var(--text); background: var(--bg); }
    li .actions button.delete:hover { color: var(--danger); background: var(--danger-soft); }
    li .actions button.save { color: var(--accent); font-weight: 600; }

    .empty { text-align: center; color: var(--muted); padding: 32px 0; }
  </style>
</head>
<body>
  <main>
    <header class="top">
      <h1>할 일 관리</h1>
      <div class="account" id="account" hidden></div>
    </header>
    <p class="summary" id="summary"></p>
    <p class="notice" id="notice" role="alert" hidden></p>

    <form id="form">
      <input type="text" id="input" placeholder="할 일을 입력하세요" autocomplete="off" aria-label="새 할 일" maxlength="500">
      <input type="date" id="due" aria-label="마감일 (선택)">
      <select id="category" aria-label="카테고리 (선택)"></select>
      <button type="submit" class="add">추가</button>
    </form>

    <div class="view-options">
      <label>카테고리 <select id="category-filter"></select></label>
      <label>정렬 <select id="sort">
        <option value="added">추가한 순</option>
        <option value="due">마감일 순</option>
      </select></label>
    </div>

    <div class="toolbar">
      <div class="filters" role="group" aria-label="보기 필터">
        <button type="button" data-filter="all">전체</button>
        <button type="button" data-filter="active">진행 중</button>
        <button type="button" data-filter="done">완료</button>
      </div>
      <button type="button" class="clear" id="clear">완료한 항목 지우기</button>
    </div>

    <ul id="list"></ul>
    <p class="empty" id="empty"></p>
  </main>

  <script type="module">
    import { firebaseConfig } from "./firebase-config.js";

    const FIREBASE_SDK = "https://www.gstatic.com/firebasejs/11.10.0";
    const STORAGE_KEY = "todos";
    const FILTER_KEY = "todos-filter";
    const CATEGORY_FILTER_KEY = "todos-category-filter";
    const SORT_KEY = "todos-sort";
    const CATEGORIES = { work: "업무", personal: "개인", study: "공부", shopping: "쇼핑" };
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const dueInput = document.getElementById("due");
    const categoryInput = document.getElementById("category");
    const categoryFilterSelect = document.getElementById("category-filter");
    const sortSelect = document.getElementById("sort");
    const list = document.getElementById("list");
    const empty = document.getElementById("empty");
    const summary = document.getElementById("summary");
    const notice = document.getElementById("notice");
    const account = document.getElementById("account");
    const clearBtn = document.getElementById("clear");
    const filterButtons = document.querySelectorAll("[data-filter]");

    let todos = readLocal(STORAGE_KEY, []);
    let filter = readLocal(FILTER_KEY, "all");
    let categoryFilter = readLocal(CATEGORY_FILTER_KEY, "all");
    let sort = readLocal(SORT_KEY, "added");
    let editingId = null;

    // 로그인 상태. user가 있으면 할 일을 Firestore(계정)에, 없으면 이 기기(localStorage)에 저장합니다.
    let user = null;
    let cloud = null;
    let cloudLoading = false;

    function readLocal(key, fallback) {
      try {
        const value = JSON.parse(localStorage.getItem(key));
        return value ?? fallback;
      } catch {
        return fallback;
      }
    }

    function writeLocal(key, value) {
      try {
        localStorage.setItem(key, JSON.stringify(value));
      } catch {
        // 저장할 수 없는 환경(사생활 보호 모드 등)에서는 그냥 넘어갑니다.
      }
    }

    // 이 기기에만 저장하는 저장소입니다. 계정 저장소(cloud)와 같은 모양으로 씁니다.
    const localStore = {
      add(todo) {
        todos.push(todo);
        writeLocal(STORAGE_KEY, todos);
        render();
      },
      update(id, fields) {
        const todo = todos.find((t) => t.id === id);
        if (todo) Object.assign(todo, fields);
        writeLocal(STORAGE_KEY, todos);
        render();
      },
      remove(ids) {
        todos = todos.filter((t) => !ids.includes(t.id));
        writeLocal(STORAGE_KEY, todos);
        render();
      },
    };

    function db() {
      return cloud || localStore;
    }

    function showNotice(message) {
      notice.textContent = message;
      notice.hidden = !message;
    }

    function reportError(err) {
      console.error(err);
      showNotice(`저장하지 못했습니다. 잠시 후 다시 시도해 주세요. (${err.code || err.message})`);
    }

    function fillCategoryOptions(select, firstLabel, firstValue) {
      select.innerHTML = "";
      select.append(new Option(firstLabel, firstValue));
      for (const [key, name] of Object.entries(CATEGORIES)) select.append(new Option(name, key));
    }

    // 같은 순간에 여러 개를 추가해도 겹치지 않도록 시간에 무작위 문자열을 붙입니다.
    function newId() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    }

    function todayString() {
      const d = new Date();
      const pad = (n) => String(n).padStart(2, "0");
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    }

    // "2026-10-14" 형식의 마감일을 사람이 읽기 쉬운 문구와 상태로 바꿉니다.
    function describeDue(due) {
      const today = new Date(todayString());
      const date = new Date(due);
      const days = Math.round((date - today) / 86400000);
      const [, m, d] = due.split("-").map(Number);
      const label = `${m}월 ${d}일`;
      if (days < 0) return { text: `${label} · ${-days}일 지남`, state: "overdue" };
      if (days === 0) return { text: `${label} · 오늘까지`, state: "today" };
      if (days === 1) return { text: `${label} · 내일까지`, state: "" };
      return { text: `${label} · ${days}일 남음`, state: "" };
    }

    // 카테고리 필터만 적용한 목록입니다. 필터 버튼의 개수도 이 범위에서 셉니다.
    function categoryScoped() {
      if (categoryFilter === "all") return todos;
      return todos.filter((t) => (t.category || "") === categoryFilter);
    }

    function visibleTodos() {
      let shown = categoryScoped();
      if (filter === "active") shown = shown.filter((t) => !t.done);
      if (filter === "done") shown = shown.filter((t) => t.done);
      if (sort === "due") {
        // 마감일이 빠른 순서, 마감일이 없는 일은 맨 뒤로 보냅니다.
        shown = [...shown].sort((a, b) => {
          if (!a.due && !b.due) return 0;
          if (!a.due) return 1;
          if (!b.due) return -1;
          return a.due < b.due ? -1 : a.due > b.due ? 1 : 0;
        });
      }
      return shown;
    }

    function startEdit(id) {
      editingId = id;
      render();
      const field = list.querySelector(".edit-fields input[type='text']");
      if (field) {
        field.focus();
        field.select();
      }
    }

    function finishEdit(todo, text, due, category) {
      const trimmed = text.trim();
      editingId = null;
      if (trimmed) {
        db().update(todo.id, { text: trimmed, due: due || "", category: category || "" });
      }
      render();
    }

    function cancelEdit() {
      editingId = null;
      render();
    }

    function button(label, className, onClick) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = label;
      if (className) b.className = className;
      b.addEventListener("click", onClick);
      return b;
    }

    function renderItem(todo) {
      const li = document.createElement("li");
      if (todo.done) li.classList.add("done");
      if (CATEGORIES[todo.category]) li.classList.add("cat-" + todo.category);

      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.checked = todo.done;
      checkbox.setAttribute("aria-label", "완료 표시");
      checkbox.addEventListener("change", () => db().update(todo.id, { done: checkbox.checked }));

      const body = document.createElement("div");
      body.className = "body";
      const actions = document.createElement("div");
      actions.className = "actions";

      if (editingId === todo.id) {
        const fields = document.createElement("div");
        fields.className = "edit-fields";
        const textField = document.createElement("input");
        textField.type = "text";
        textField.value = todo.text;
        textField.maxLength = 500;
        textField.setAttribute("aria-label", "할 일 수정");
        const dueField = document.createElement("input");
        dueField.type = "date";
        dueField.value = todo.due || "";
        dueField.setAttribute("aria-label", "마감일 수정");
        const categoryField = document.createElement("select");
        fillCategoryOptions(categoryField, "카테고리 없음", "");
        categoryField.value = todo.category || "";
        categoryField.setAttribute("aria-label", "카테고리 수정");

        const saveEdit = () => finishEdit(todo, textField.value, dueField.value, categoryField.value);
        const onKey = (e) => {
          if (e.key === "Enter") saveEdit();
          if (e.key === "Escape") cancelEdit();
        };
        textField.addEventListener("keydown", onKey);
        dueField.addEventListener("keydown", onKey);
        categoryField.addEventListener("keydown", onKey);

        fields.append(textField, dueField, categoryField);
        body.append(fields);
        actions.append(
          button("저장", "save", saveEdit),
          button("취소", "", cancelEdit)
        );
      } else {
        const text = document.createElement("div");
        text.className = "text";
        if (CATEGORIES[todo.category]) {
          const tag = document.createElement("span");
          tag.className = "tag " + todo.category;
          tag.textContent = CATEGORIES[todo.category];
          text.append(tag);
        }
        text.append(todo.text);
        text.title = "더블클릭해서 수정";
        text.addEventListener("dblclick", () => startEdit(todo.id));
        body.append(text);

        if (todo.due) {
          const info = describeDue(todo.due);
          const due = document.createElement("span");
          due.className = "due" + (info.state ? " " + info.state : "");
          due.textContent = info.text;
          body.append(due);
        }

        actions.append(
          button("수정", "", () => startEdit(todo.id)),
          button("삭제", "delete", () => db().remove([todo.id]))
        );
      }

      li.append(checkbox, body, actions);
      return li;
    }

    // 수정 중에 다른 기기의 변경이 들어와 목록을 다시 그려도, 입력하던 내용을 잃지 않게 보관합니다.
    function captureDraft() {
      const fields = list.querySelector(".edit-fields");
      if (!fields) return null;
      const [text, due, category] = fields.querySelectorAll("input, select");
      return { text: text.value, due: due.value, category: category.value, focused: fields.contains(document.activeElement) };
    }

    function restoreDraft(draft) {
      const fields = list.querySelector(".edit-fields");
      if (!fields || !draft) return;
      const [text, due, category] = fields.querySelectorAll("input, select");
      text.value = draft.text;
      due.value = draft.due;
      category.value = draft.category;
      if (draft.focused) text.focus();
    }

    function render() {
      if (editingId && !todos.some((t) => t.id === editingId)) editingId = null;
      const draft = editingId ? captureDraft() : null;

      list.innerHTML = "";
      const shown = visibleTodos();
      for (const todo of shown) list.append(renderItem(todo));
      restoreDraft(draft);

      const doneCount = todos.filter((t) => t.done).length;
      const activeCount = todos.length - doneCount;
      const today = todayString();
      const overdueCount = todos.filter((t) => !t.done && t.due && t.due < today).length;

      summary.textContent = todos.length
        ? `전체 ${todos.length}개 · 완료 ${doneCount}개 · 남은 일 ${activeCount}개` +
          (overdueCount ? ` · 마감 지남 ${overdueCount}개` : "")
        : "오늘 할 일을 정리해 보세요.";
      if (user) {
        const status = document.createElement("span");
        status.className = "cloud";
        status.textContent = " · 계정에 저장됨";
        summary.append(status);
      }

      const scoped = categoryScoped();
      const scopedDone = scoped.filter((t) => t.done).length;
      const counts = { all: scoped.length, active: scoped.length - scopedDone, done: scopedDone };
      const names = { all: "전체", active: "진행 중", done: "완료" };
      filterButtons.forEach((b) => {
        const key = b.dataset.filter;
        b.textContent = `${names[key]} ${counts[key]}`;
        b.setAttribute("aria-pressed", String(key === filter));
      });

      clearBtn.disabled = doneCount === 0;

      if (shown.length > 0) {
        empty.hidden = true;
      } else {
        empty.hidden = false;
        empty.textContent =
          cloudLoading ? "계정에서 할 일을 불러오는 중입니다..." :
          todos.length === 0 ? "아직 할 일이 없습니다. 위에 입력해서 추가해 보세요." :
          scoped.length === 0 ? `'${CATEGORIES[categoryFilter] || "카테고리 없음"}' 할 일이 없습니다.` :
          filter === "active" ? "진행 중인 할 일이 없습니다. 모두 끝냈어요!" :
          "아직 완료한 할 일이 없습니다.";
      }
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      const category = categoryInput.value;
      const due = dueInput.value || "";
      input.value = "";
      dueInput.value = "";
      // 방금 추가한 일이 현재 보기에서 숨겨지지 않도록 필터를 풀어 줍니다.
      if (filter === "done") {
        filter = "all";
        writeLocal(FILTER_KEY, filter);
      }
      if (categoryFilter !== "all" && categoryFilter !== category) {
        categoryFilter = "all";
        categoryFilterSelect.value = "all";
        writeLocal(CATEGORY_FILTER_KEY, categoryFilter);
      }
      db().add({ id: newId(), text, done: false, due, category, created: Date.now() });
      input.focus();
    });

    filterButtons.forEach((b) =>
      b.addEventListener("click", () => {
        filter = b.dataset.filter;
        writeLocal(FILTER_KEY, filter);
        editingId = null;
        render();
      })
    );

    clearBtn.addEventListener("click", () => {
      const doneIds = todos.filter((t) => t.done).map((t) => t.id);
      if (!doneIds.length) return;
      if (!confirm(`완료한 할 일 ${doneIds.length}개를 지울까요?`)) return;
      db().remove(doneIds);
    });

    fillCategoryOptions(categoryInput, "카테고리 없음", "");
    fillCategoryOptions(categoryFilterSelect, "전체", "all");
    categoryFilterSelect.append(new Option("카테고리 없음", ""));
    categoryFilterSelect.value = categoryFilter;
    if (categoryFilterSelect.value !== categoryFilter) categoryFilter = "all";
    sortSelect.value = sort;

    categoryFilterSelect.addEventListener("change", () => {
      categoryFilter = categoryFilterSelect.value;
      writeLocal(CATEGORY_FILTER_KEY, categoryFilter);
      editingId = null;
      render();
    });

    sortSelect.addEventListener("change", () => {
      sort = sortSelect.value;
      writeLocal(SORT_KEY, sort);
      render();
    });

    render();

    // ---- 로그인과 계정 저장 (Firebase) ----

    const AUTH_ERRORS = {
      "auth/unauthorized-domain": "이 주소에서는 로그인할 수 없습니다. Firebase 콘솔 > Authentication > 설정 > 승인된 도메인에 이 사이트 주소를 추가해 주세요.",
      "auth/popup-blocked": "로그인 창이 차단되었습니다. 브라우저에서 팝업을 허용한 뒤 다시 눌러 주세요.",
      "auth/operation-not-allowed": "Google 로그인이 꺼져 있습니다. Firebase 콘솔 > Authentication > 로그인 방법에서 Google을 사용 설정해 주세요.",
      "auth/network-request-failed": "인터넷 연결을 확인한 뒤 다시 시도해 주세요.",
    };
    const IGNORED_AUTH_ERRORS = ["auth/popup-closed-by-user", "auth/cancelled-popup-request"];

    function renderAccount(actions) {
      account.innerHTML = "";
      account.hidden = false;
      if (user) {
        if (user.photoURL) {
          const img = document.createElement("img");
          img.src = user.photoURL;
          img.alt = "";
          img.referrerPolicy = "no-referrer";
          account.append(img);
        }
        const name = document.createElement("span");
        name.className = "name";
        name.textContent = user.displayName || user.email || "내 계정";
        account.append(name, button("로그아웃", "", actions.signOut));
      } else {
        const hint = document.createElement("span");
        hint.textContent = "이 기기에만 저장 중";
        account.append(hint, button("Google로 로그인", "", actions.signIn));
      }
    }

    async function startFirebase() {
      const [{ initializeApp }, authSdk, fs] = await Promise.all([
        import(`${FIREBASE_SDK}/firebase-app.js`),
        import(`${FIREBASE_SDK}/firebase-auth.js`),
        import(`${FIREBASE_SDK}/firebase-firestore.js`),
      ]);
      const app = initializeApp(firebaseConfig);
      const auth = authSdk.getAuth(app);
      const firestore = fs.getFirestore(app);
      let unsubscribe = null;

      const actions = {
        signIn: () => {
          showNotice("");
          authSdk.signInWithPopup(auth, new authSdk.GoogleAuthProvider()).catch((err) => {
            if (IGNORED_AUTH_ERRORS.includes(err.code)) return;
            console.error(err);
            showNotice(AUTH_ERRORS[err.code] || `로그인하지 못했습니다. (${err.code || err.message})`);
          });
        },
        signOut: () => authSdk.signOut(auth),
      };

      // 로그인 전에 이 기기에 적어 둔 할 일을 계정으로 옮길지 묻습니다.
      async function migrateLocalTodos(col) {
        const local = readLocal(STORAGE_KEY, []);
        if (!local.length) return;
        if (!confirm(`이 기기에만 저장된 할 일 ${local.length}개를 계정으로 옮길까요?\n옮기면 다른 기기에서도 볼 수 있습니다.`)) return;
        const batch = fs.writeBatch(firestore);
        const base = Date.now();
        local.forEach((t, i) => {
          const id = String(t.id);
          batch.set(fs.doc(col, id), {
            id,
            text: String(t.text).slice(0, 500),
            done: !!t.done,
            due: t.due || "",
            category: t.category || "",
            created: typeof t.created === "number" ? t.created : base + i,
          });
        });
        await batch.commit();
        writeLocal(STORAGE_KEY, []);
      }

      authSdk.onAuthStateChanged(auth, async (signedIn) => {
        if (unsubscribe) {
          unsubscribe();
          unsubscribe = null;
        }
        user = signedIn;
        editingId = null;
        renderAccount(actions);

        if (!user) {
          cloud = null;
          cloudLoading = false;
          todos = readLocal(STORAGE_KEY, []);
          render();
          return;
        }

        const col = fs.collection(firestore, "users", user.uid, "todos");
        cloud = {
          add: (todo) => fs.setDoc(fs.doc(col, todo.id), todo).catch(reportError),
          update: (id, fields) => fs.updateDoc(fs.doc(col, id), fields).catch(reportError),
          remove: (ids) => {
            const batch = fs.writeBatch(firestore);
            ids.forEach((id) => batch.delete(fs.doc(col, id)));
            return batch.commit().catch(reportError);
          },
        };
        todos = [];
        cloudLoading = true;
        render();

        try {
          await migrateLocalTodos(col);
        } catch (err) {
          reportError(err);
        }
        if (user !== signedIn) return; // 옮기는 사이에 로그아웃한 경우

        // 계정의 할 일을 실시간으로 받아옵니다. 다른 기기에서 바꾼 내용도 바로 반영됩니다.
        unsubscribe = fs.onSnapshot(
          fs.query(col, fs.orderBy("created")),
          (snap) => {
            todos = snap.docs.map((d) => d.data());
            cloudLoading = false;
            render();
          },
          (err) => {
            cloudLoading = false;
            reportError(err);
            render();
          }
        );
      });
    }

    if (firebaseConfig.apiKey) {
      startFirebase().catch((err) => {
        console.error(err);
        showNotice("로그인 기능을 불러오지 못했습니다. 지금은 이 기기에만 저장됩니다.");
      });
    }
  </script>
</body>
</html>
